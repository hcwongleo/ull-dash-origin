AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ULL-DASH origin, DIRECT INGEST. Elemental Live pushes its chunked PUT straight
  to the EC2 origin - no ingest CloudFront, no Lambda@Edge. Playback still goes
  through CloudFront, which is where a CDN actually earns its keep.

# KEEP THIS FILE UNDER 51,200 BYTES. That is CloudFormation's limit for a template
# passed inline, which is what "aws cloudformation deploy --template-file" does.
# Console upload goes via S3 and allows 1 MB, but breaking the CLI path would be a
# nasty surprise for whoever automates this. Rationale lives in docs/, not here.
#
# WHY DIRECT INGEST, in one paragraph
#   A CDN's value is fan-out to many readers, and ingest has exactly one writer - so
#   an ingest CDN adds a hop and a Lambda invocation for nothing. It also forces the
#   security group to accept write methods from CloudFront's entire prefix list,
#   which puts every distribution in the world inside your write perimeter. Here
#   writes come only from EncoderCidr. The cost is that ingest is plaintext HTTP.
#   Full reasoning, and the unresolved question of whether an ingest CDN coalesces
#   the chunked body: docs/design-notes.md.
#
# SECURITY
#   Ingest is UNAUTHENTICATED. EncoderCidr is the only control, has no default, and
#   0.0.0.0/0 is rejected by a Rules assertion below. If the encoder is on-premises,
#   prefer Direct Connect or a VPN over plaintext across the public internet.
#   TLS on the origin needs a real domain plus a publicly trusted certificate,
#   because CloudFront rejects a self-signed certificate on a custom origin.
# ---------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: 'Required' }
        Parameters: [EncoderCidr]
      - Label: { default: 'Usually leave alone' }
        Parameters: [ReleaseTag, StreamName, InstanceType, ChannelPrefix]
      - Label: { default: 'Monitoring' }
        Parameters: [AlarmEmail, HeapAlarmBytes, IngestStaleAlarmSeconds, MetricNamespace]
      - Label: { default: 'Advanced' }
        Parameters: [RepoUrl, AmiId, OriginPort, RootVolumeSizeGb, CloudFrontOriginPrefixList, SegmentCacheSeconds]
    ParameterLabels:
      EncoderCidr: { default: 'Elemental Live public IP (as a /32)' }
      AlarmEmail: { default: 'Email for alarms (optional)' }
      ReleaseTag: { default: 'Version to deploy' }
      StreamName: { default: 'Stream name' }
      InstanceType: { default: 'Instance size' }

Parameters:
  ChannelPrefix:
    Type: String
    Default: ch18d
    AllowedPattern: '[a-z0-9-]+'
    Description: Distinct from ch18a/ch18b so this can run alongside them.

  StreamName:
    Type: String
    Default: ch18live

  EncoderCidr:
    Type: String
    AllowedPattern: '^((25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(25[0-5]|2[0-4]\d|1?\d?\d)/(3[0-2]|[12]?\d)$'
    ConstraintDescription: >-
      Must be a single CIDR, e.g. 203.0.113.10/32. 0.0.0.0/0 is rejected below -
      ingest has no authentication, so an open range means anyone can inject or
      delete segments in your live stream.
    Description: >-
      Public address of the Elemental Live encoder. Use /32. This is the ONLY
      control protecting ingest.

  InstanceType:
    Type: String
    Default: c8g.4xlarge
    Description: >-
      Graviton4, 16 vCPU / 32 GB. Sized for CONCURRENCY, not memory: memory is
      capped at 25% by the unit file and steady state is ~25MB.

      The load that scales with audience is held requests. -w holds a GET for a
      not-yet-arrived segment for up to 2.5s, and live requests are synchronised
      because every viewer wants the same segment at the same instant. At 100k
      viewers with ~10% early at any moment that is roughly 15,000 concurrent held
      requests, about 3.5 cores by measurement (2000 readers = 0.39 cores). 16 vCPU
      is ~4x that. Note the 100k figure is extrapolated, not tested.

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: >-
      Resolved automatically so nothing has to be looked up by hand.

      CAUTION ON STACK UPDATES: this resolves the PATH, not a fixed value, so a
      later Amazon Linux release will replace the instance during an unrelated
      stack update. Rebuilding is harmless, but the replacement clears RAM, and
      Elemental Live only sends initialisation segments at output start - so it
      needs an encoder output restart. When updating, pass an explicit ami-xxxx
      to hold the instance still.

  ReleaseTag:
    Type: String
    Default: v0.5.0
    Description: >-
      Git tag to build. Pinned, so a redeploy always produces the same binary.
      The instance clones this tag and compiles it at first boot - dependencies
      are vendored, so it needs GitHub and nothing else.

  RepoUrl:
    Type: String
    Default: https://github.com/hcwongleo/ull-dash-origin.git
    Description: Source repository. Override only if you have mirrored it.

  OriginPort:
    Type: Number
    Default: 9094

  MetricNamespace:
    Type: String
    Default: ULLOrigin
    Description: CloudWatch namespace for the origin's own metrics. The instance role is scoped to this namespace and nothing else.

  AlarmEmail:
    Type: String
    Default: ''
    Description: >-
      Optional. An address subscribed to the alarm topic. Leave empty to create the
      topic without subscribers and add them yourself - a topic with no
      subscription raises alarms nobody sees.

  HeapAlarmBytes:
    Type: Number
    Default: 1073741824
    Description: >-
      Alarm above this heap. Default 1 GB: ~40x the measured steady state of 25 MB
      for a 4 Mbps stream, and 4x below MemoryMax, so it warns well before the kill.

  IngestStaleAlarmSeconds:
    Type: Number
    Default: 60
    Description: >-
      Alarm when no bytes have been ingested for this long. This is the only signal
      that the stream is off the air; nothing else reports it.

  RootVolumeSizeGb:
    Type: Number
    Default: 30
    MinValue: 8
    Description: >-
      Root volume size. Measured usage is 2.4 GB, and the worst case is about 3.2 GB
      once journald reaches its cap of 10% of the filesystem. Nothing else is
      written to disk - content is held in RAM.

      Note this is gp3, where IOPS and throughput are DECOUPLED from size: 8 GB and
      100 GB both give 3000 IOPS and 125 MB/s. Enlarging the volume buys capacity
      only, not speed. 20 GB is comfortable headroom for patching and dnf cache.

  CpuAlarmPercent:
    Type: Number
    Default: 50
    Description: >-
      Alarm above this CPU for 15 minutes. Measured steady state is 0.0036 cores -
      about 0.05% of 8 vCPU - so 50% is ~1000x normal. It exists as a backstop for
      any runaway, including the read-path spin that cost one core per viewer
      before it was fixed: six stuck readers on 8 vCPU would sit around 75%.

  EnableCloudFrontAdditionalMetrics:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      CloudFront's default metrics are free but coarse. The additional metrics -
      CacheHitRate, OriginLatency and per-status error rates - must be switched on
      per distribution and cost about USD 2.40/month for this one. CacheHitRate is
      the one worth paying for: it is the only direct measure of how much viewer
      traffic is reaching the origin rather than being served from the edge.

  CloudFrontOriginPrefixList:
    Type: String
    Default: pl-14b2577d
    Description: >-
      CloudFront origin-facing managed prefix list, used for the PLAYBACK path
      only (ap-east-1 = pl-14b2577d). Look up per region with:
      aws ec2 describe-managed-prefix-lists --filters
      Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing

  # Long TTL is only safe because the encoder's segment names carry a per-run
  # token, so a name is never reused for different bytes. Verify that before
  # raising it: if names are ever recycled, viewers are served stale video, which
  # is a far worse failure than a cache miss.
  SegmentCacheSeconds:
    Type: Number
    Default: 21600

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  WantCfAdditionalMetrics: !Equals [!Ref EnableCloudFrontAdditionalMetrics, 'true']

Rules:
  RejectOpenEncoderCidr:
    Assertions:
      - Assert: !Not [!Equals [!Ref EncoderCidr, '0.0.0.0/0']]
        AssertDescription: >-
          EncoderCidr must not be 0.0.0.0/0. Ingest is unauthenticated, so an
          open range lets anyone PUT or DELETE segments in your live stream.

Mappings:
  ManagedPolicies:
    Cache:
      Disabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
    OriginRequest:
      AllViewerExceptHost: b689b0a8-53d0-40ab-baf2-68738e2966ac
    ResponseHeaders:
      CorsPreflight: 5cc3b908-e619-4b99-88e5-2cf7f45965bd

Resources:

  # ---------------- Network ----------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.30.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-origin-vpc' }]

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-origin-igw' }]

  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-origin-public' }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  SubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # Two ingress rules with different sources on the same port:
  #   - the encoder, for PUT/DELETE (ingest)
  #   - CloudFront's origin-facing prefix list, for GET (playback)
  #
  # This is the one real security gain of direct ingest. With an ingest CDN in
  # front, the prefix list has to allow write methods, so ANY CloudFront
  # distribution in the world can PUT to your origin. Here only the encoder can.
  OriginSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ULL-DASH origin - ingest from the encoder only, playback from CloudFront only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-origin-sg' }]

  IngestFromEncoder:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref OriginSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref OriginPort
      ToPort: !Ref OriginPort
      CidrIp: !Ref EncoderCidr
      Description: Elemental Live chunked PUT - the only write path

  PlaybackFromCloudFront:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref OriginSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref OriginPort
      ToPort: !Ref OriginPort
      SourcePrefixListId: !Ref CloudFrontOriginPrefixList
      Description: Playback CloudFront origin fetches

  # ---------------- Stable address for the encoder ----------------
  # An EIP, because the encoder's destination should not change when the instance
  # is stopped and started. A public DNS name does change, and re-pointing a live
  # encoder is not something you want on the critical path of a recovery.
  OriginEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-origin-eip' }]

  OriginEipAssoc:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt OriginEip.AllocationId
      InstanceId: !Ref OriginInstance

  # ---------------- IAM ----------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      # SSM for access; PutMetricData so the origin's own metrics reach CloudWatch.
      # The build comes from a public git tag, so no S3 access is needed and there
      # is no bucket policy or artifact staging to get wrong.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: publish-own-metrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # PutMetricData takes no resource ARN; the namespace condition is the
              # only way to scope it, and it stops this role writing anywhere else.
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Ref MetricNamespace

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ---------------- Origin ----------------
  # Installs a prebuilt, tested binary rather than cloning and compiling at boot.
  # A build at first boot means the code a replacement instance runs depends on
  # whatever upstream HEAD happens to be that day.
  OriginInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref OriginSecurityGroup]
      # Declared explicitly rather than inherited from the AMI, so a future Amazon
      # Linux release cannot silently change the size or type underneath you.
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGb
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-origin' }]
      # CreationPolicy so the stack does not report CREATE_COMPLETE while the
      # compile is still running. Without it an operator sees success and points
      # an encoder at an origin that is not listening yet.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > >(tee /var/log/origin-bootstrap.log) 2>&1
          set -x

          # aws-cfn-bootstrap is NOT preinstalled on Amazon Linux 2023 - it was on
          # AL2. Without it cfn-signal does not exist, no signal is ever sent, and
          # the CreationPolicy below times out and rolls the whole stack back.
          # Installed FIRST, so the error trap below always has a working signal.
          dnf install -y aws-cfn-bootstrap golang git

          fail() { /opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} \
                     --resource OriginInstance --region ${AWS::Region}; exit 1; }
          trap fail ERR

          # A pinned tag, so this builds the same bytes every time. Dependencies
          # are vendored and GOPROXY is off: the only network dependency is the
          # repository itself, not a module proxy that could resolve differently
          # later.
          rm -rf /opt/src
          git clone --depth 1 --branch ${ReleaseTag} ${RepoUrl} /opt/src
          cd /opt/src
          CGO_ENABLED=0 GOFLAGS=-mod=vendor GOPROXY=off GOCACHE=/tmp/gc HOME=/root \
            go build -trimpath \
            -ldflags "-s -w -X main.gitSHA=$(git rev-parse --short HEAD)" \
            -o /opt/src/go-chunked-streaming-server main.go

          # Same script an operator runs to upgrade, so there is one install path.
          /opt/src/deploy/install.sh

          curl -sf --max-time 5 http://127.0.0.1:9095/-/healthz || fail
          /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} \
            --resource OriginInstance --region ${AWS::Region}

  # ---------------- PLAYBACK CloudFront ----------------
  # Segments are immutable once written, so they cache for hours. The manifest
  # must not: it is rewritten every second, and serving a stale one moves the
  # player's idea of the live edge.
  SegmentCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${ChannelPrefix}-segments'
        Comment: Immutable media segments - long TTL, safe only while names carry a per-run token
        DefaultTTL: !Ref SegmentCacheSeconds
        MaxTTL: !Ref SegmentCacheSeconds
        MinTTL: !Ref SegmentCacheSeconds
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  ManifestCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${ChannelPrefix}-manifest'
        Comment: Live manifest - must stay at or below the encoder's minimumUpdatePeriod
        DefaultTTL: 1
        MaxTTL: 1
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  PlaybackDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ChannelPrefix} ULL-DASH - PLAYBACK only (ingest goes direct to EC2)'
        HttpVersion: http2and3
        Origins:
          - Id: ec2-origin
            DomainName: !Sub
              - 'ec2-${DashedIp}.${Region}.compute.amazonaws.com'
              - DashedIp: !Join ['-', !Split ['.', !Ref OriginEip]]
                Region: !Ref AWS::Region
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: !Ref OriginPort
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        # GET/HEAD/OPTIONS only. Playback has no business writing, and this is
        # what keeps the write path exclusive to the encoder's address.
        DefaultCacheBehavior:
          TargetOriginId: ec2-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: false
          CachePolicyId: !Ref SegmentCachePolicy
          OriginRequestPolicyId: !FindInMap [ManagedPolicies, OriginRequest, AllViewerExceptHost]
          ResponseHeadersPolicyId: !FindInMap [ManagedPolicies, ResponseHeaders, CorsPreflight]
        CacheBehaviors:
          # Matches nested paths too, verified: *.mpd hits /a/b/c.mpd.
          - PathPattern: '*.mpd'
            TargetOriginId: ec2-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref ManifestCachePolicy
            OriginRequestPolicyId: !FindInMap [ManagedPolicies, OriginRequest, AllViewerExceptHost]
            ResponseHeadersPolicyId: !FindInMap [ManagedPolicies, ResponseHeaders, CorsPreflight]
        CustomErrorResponses:
          # Never cache a negative at the live edge: the segment a player asked
          # for a moment early exists a moment later.
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          # 404 is the one negative worth caching, briefly. ULL players request
          # segments before they exist because the manifest invites it, and those
          # requests are synchronised across the whole audience - so an uncached 404
          # is one origin hit per viewer, in a burst every segment boundary. One
          # second collapses that to one per POP while costing at most 1s of
          # staleness on a segment that has just become available.
          - ErrorCode: 404
            ErrorCachingMinTTL: 1
          - ErrorCode: 500
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0

  # CloudFront additional metrics are opt-in per distribution. Without this
  # resource CacheHitRate, OriginLatency and the per-status error rates are not
  # published at all, and dashboard widgets referencing them stay empty.
  PlaybackMonitoringSubscription:
    Type: AWS::CloudFront::MonitoringSubscription
    Condition: WantCfAdditionalMetrics
    Properties:
      DistributionId: !Ref PlaybackDistribution
      MonitoringSubscription:
        RealtimeMetricsSubscriptionConfig:
          RealtimeMetricsSubscriptionStatus: Enabled

  # ---------------- Monitoring ----------------
  # /-/metrics is bound to localhost, so without this the numbers worth alarming on
  # are unreachable. A systemd timer on the instance scrapes them into this
  # namespace every 5 minutes; see deploy/publish-metrics.sh.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ChannelPrefix}-origin-alarms'
      DisplayName: ULL-DASH origin alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # The highest-value alarm, and nothing to do with leaks: it is the only thing
  # that reports the stream is off the air without a viewer complaining.
  #
  # TreatMissingData: breaching is deliberate. The publisher deliberately sends
  # NOTHING when the origin's admin endpoint does not answer, because a zero would
  # be indistinguishable from a healthy reading. Absent data therefore means the
  # origin is not answering, which is exactly when this should fire.
  IngestStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ChannelPrefix}-origin-ingest-stale'
      AlarmDescription: No bytes ingested recently, or the origin is not answering at all. The stream is probably off the air.
      Namespace: !Ref MetricNamespace
      MetricName: LastIngestAgeSeconds
      Dimensions:
        - Name: InstanceId
          Value: !Ref OriginInstance
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref IngestStaleAlarmSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # Heap should plateau. Sustained growth is the shape every leak in this server
  # has taken, and the OOM kill it leads to empties RAM - which loses the
  # initialisation segments and needs an encoder restart.
  HeapAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ChannelPrefix}-origin-heap'
      AlarmDescription: Heap well above steady state. Check whether the encoder has stopped sending DELETEs.
      Namespace: !Ref MetricNamespace
      MetricName: HeapAllocBytes
      Dimensions:
        - Name: InstanceId
          Value: !Ref OriginInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref HeapAlarmBytes
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Goroutines reveal leaked readers or ingests earlier and more cheaply than heap.
  GoroutineAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ChannelPrefix}-origin-goroutines'
      AlarmDescription: >-
        Goroutines are not returning to baseline. Go runs one per in-flight request,
        so this count IS the number of requests currently in progress - measured on
        this origin: 5 idle, 25 with 20 readers, 85 with 80 readers, back to 5 when
        they finish. A count that ratchets up and never comes down means requests
        are stuck, which is the shape every leak in this server has had: readers
        spinning after a viewer disconnected, ingests blocked on a socket that went
        quiet, readers parked on a file that was reclaimed. Check /-/metrics
        readers_active and /debug/pprof/goroutine over SSM.
      Namespace: !Ref MetricNamespace
      MetricName: Goroutines
      Dimensions:
        - Name: InstanceId
          Value: !Ref OriginInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      # High because -w is enabled: a held request legitimately occupies a goroutine
      # for up to 2.5s, so at scale tens of thousands are normal rather than a leak.
      # This is watching for a ratchet that never comes down, not for load.
      Threshold: 30000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # A backstop for any runaway, not a load policeman. The specific failure it would
  # have caught is the read-path spin: one CPU core burned per live-edge viewer,
  # forever, because a disconnected reader never noticed and never exited.
  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ChannelPrefix}-origin-cpu'
      AlarmDescription: >-
        Sustained CPU far above the measured steady state of 0.0036 cores. Serving
        this stream costs almost nothing, so this means something is spinning rather
        than working. Check gcss_readers_active and go_goroutines first, then
        /debug/pprof/profile over SSM.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref OriginInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref CpuAlarmPercent
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The alarm that tells you to go and restart the encoder output.
  #
  # EC2 automatic recovery is already enabled by default and will migrate the
  # instance without being asked - but it does not NOTIFY, and recovery empties RAM.
  # Elemental Live only sends initialisation segments when an output group starts,
  # so after a host event new viewers get 404 on init until the encoder output is
  # restarted. Existing viewers keep playing, which is what makes it easy to miss.
  HostEventAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ChannelPrefix}-origin-host-check-failed'
      AlarmDescription: >-
        The instance or its host failed a status check. AWS automatic recovery may
        migrate it without asking, and that empties RAM - which loses the
        initialisation segments. ACTION: once it is back, confirm the init segments
        are being served, and if not restart the Elemental Live output group.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref OriginInstance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # NOTE: there is deliberately NO CloudFront alarm anywhere in this solution.
  # CloudWatch alarms are regional and CloudFront publishes only to us-east-1 -
  # verified: AWS/CloudFront has 0 metrics in this region and 100 in us-east-1. An
  # alarm here would sit in OK forever and never fire, and putting one in us-east-1
  # means a second stack plus a second SNS topic and email confirmation for a single
  # rate-based metric that is silent until you have an audience.
  #
  # The origin-side alarms cover the same ground without that blind spot: if the
  # origin stops answering, ingest-stale fires because the publisher deliberately
  # sends nothing and missing data is treated as breaching. CloudFront errors remain
  # visible on the dashboard, which CAN graph across regions - only alarms cannot.

  # One URL that answers "is the stream up, is memory fine, is anything alarming",
  # so an operator does not need an SSM session to find out. The first three
  # dashboards in an account are free.
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ChannelPrefix}-origin'
      DashboardBody: !Sub |
        {
          "widgets": [
            { "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": { "markdown": "## ULL-DASH origin \u2014 ${ChannelPrefix}\n**Is the stream on air?** Ingest age should sit at 0\u20132 s. **Is memory healthy?** Heap should be flat. **Are viewers being served from the edge?** Cache hit rate should be high \u2014 a low rate means every viewer is reaching the origin." } },

            { "type": "alarm", "x": 0, "y": 2, "width": 24, "height": 2,
              "properties": { "title": "Alarms",
                "alarms": [ "${IngestStaleAlarm.Arn}", "${HeapAlarm.Arn}", "${GoroutineAlarm.Arn}" ] } },

            { "type": "text", "x": 0, "y": 4, "width": 24, "height": 1,
              "properties": { "markdown": "### Origin \\u2014 from inside the instance, published every 5 min by a systemd timer\\n\\n**Goroutines = requests currently in progress.** Go uses one per request, so the count rises with viewers and **must fall back to ~5 when they leave**. Measured on this origin: 5 idle, 25 with 20 readers, 85 with 80 readers, then 5 again. A count that climbs and never comes down means requests are stuck \\u2014 that is how every leak in this server has looked: readers spinning after a viewer disconnected, ingests blocked on a socket that went quiet, readers waiting on a file that was reclaimed.\\n\\n**Heap** should be flat. **Ingest age** should sit at 0\\u20132 s. **Swept** and **aborted** should both stay flat." } },

            { "type": "metric", "x": 0, "y": 5, "width": 8, "height": 6,
              "properties": {
                "title": "Ingest age \u2014 is the encoder pushing?",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 300,
                "yAxis": { "left": { "min": 0, "label": "seconds" } },
                "metrics": [ [ "${MetricNamespace}", "LastIngestAgeSeconds", "InstanceId", "${OriginInstance}", { "label": "seconds since last byte" } ] ],
                "annotations": { "horizontal": [ { "label": "stale", "value": ${IngestStaleAlarmSeconds}, "color": "#d13212" } ] } } },

            { "type": "metric", "x": 8, "y": 5, "width": 8, "height": 6,
              "properties": {
                "title": "Heap \u2014 should plateau, not climb",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 300,
                "yAxis": { "left": { "min": 0, "label": "bytes" } },
                "metrics": [ [ "${MetricNamespace}", "HeapAllocBytes", "InstanceId", "${OriginInstance}", { "label": "live heap" } ] ],
                "annotations": { "horizontal": [ { "label": "alarm", "value": ${HeapAlarmBytes}, "color": "#d13212" } ] } } },

            { "type": "metric", "x": 16, "y": 5, "width": 8, "height": 6,
              "properties": {
                "title": "Goroutines and files held",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 300,
                "metrics": [
                  [ "${MetricNamespace}", "Goroutines", "InstanceId", "${OriginInstance}", { "label": "goroutines" } ],
                  [ "${MetricNamespace}", "FilesHeld", "InstanceId", "${OriginInstance}", { "label": "files in RAM" } ] ] } },

            { "type": "metric", "x": 0, "y": 11, "width": 8, "height": 5,
              "properties": {
                "title": "Swept and aborted \u2014 both should stay flat",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 300,
                "metrics": [
                  [ "${MetricNamespace}", "SweptTotal", "InstanceId", "${OriginInstance}", { "label": "files swept (cumulative)" } ],
                  [ "${MetricNamespace}", "PutAbortedTotal", "InstanceId", "${OriginInstance}", { "label": "ingests aborted (cumulative)" } ] ] } },

            { "type": "metric", "x": 8, "y": 11, "width": 8, "height": 5,
              "properties": {
                "title": "Instance CPU",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 300,
                "yAxis": { "left": { "min": 0, "label": "percent" } },
                "metrics": [ [ "AWS/EC2", "CPUUtilization", "InstanceId", "${OriginInstance}", { "label": "CPU %" } ] ] } },

            { "type": "metric", "x": 16, "y": 11, "width": 8, "height": 5,
              "properties": {
                "title": "Instance network \u2014 in is ingest, out is CDN fetches",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  [ "AWS/EC2", "NetworkIn", "InstanceId", "${OriginInstance}", { "label": "in (encoder)" } ],
                  [ "AWS/EC2", "NetworkOut", "InstanceId", "${OriginInstance}", { "label": "out (to CloudFront)" } ] ] } },

            { "type": "text", "x": 0, "y": 16, "width": 24, "height": 1,
              "properties": { "markdown": "### Playback CloudFront \u2014 free metrics. CloudFront only publishes to us-east-1, whatever region the origin is in." } },

            { "type": "metric", "x": 0, "y": 17, "width": 8, "height": 6,
              "properties": {
                "title": "Requests",
                "region": "us-east-1", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [ [ "AWS/CloudFront", "Requests", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "viewer requests" } ] ] } },

            { "type": "metric", "x": 8, "y": 17, "width": 8, "height": 6,
              "properties": {
                "title": "Bytes to viewers / from encoder",
                "region": "us-east-1", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  [ "AWS/CloudFront", "BytesDownloaded", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "downloaded by viewers" } ],
                  [ "AWS/CloudFront", "BytesUploaded", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "uploaded" } ] ] } },

            { "type": "metric", "x": 16, "y": 17, "width": 8, "height": 6,
              "properties": {
                "title": "Error rates \u2014 total, 4xx, 5xx",
                "region": "us-east-1", "view": "timeSeries", "stat": "Average", "period": 300,
                "yAxis": { "left": { "min": 0, "label": "percent" } },
                "metrics": [
                  [ "AWS/CloudFront", "TotalErrorRate", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "total" } ],
                  [ "AWS/CloudFront", "4xxErrorRate", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "4xx" } ],
                  [ "AWS/CloudFront", "5xxErrorRate", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "5xx" } ] ] } },

            { "type": "text", "x": 0, "y": 23, "width": 24, "height": 1,
              "properties": { "markdown": "### Playback CloudFront \u2014 additional metrics (opt-in, ~USD 2.40/month). Empty widgets mean **EnableCloudFrontAdditionalMetrics** is false." } },

            { "type": "metric", "x": 0, "y": 24, "width": 8, "height": 6,
              "properties": {
                "title": "Cache hit rate \u2014 the number that protects the origin",
                "region": "us-east-1", "view": "timeSeries", "stat": "Average", "period": 300,
                "yAxis": { "left": { "min": 0, "max": 100, "label": "percent" } },
                "metrics": [ [ "AWS/CloudFront", "CacheHitRate", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "hit rate %" } ] ],
                "annotations": { "horizontal": [ { "label": "expect high once segments are cached", "value": 80, "color": "#2ca02c" } ] } } },

            { "type": "metric", "x": 8, "y": 24, "width": 8, "height": 6,
              "properties": {
                "title": "Origin latency \u2014 high at the live edge is EXPECTED",
                "region": "us-east-1", "view": "timeSeries", "stat": "Average", "period": 300,
                "yAxis": { "left": { "min": 0, "label": "ms" } },
                "metrics": [ [ "AWS/CloudFront", "OriginLatency", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "origin first byte" } ] ] } },

            { "type": "metric", "x": 16, "y": 24, "width": 8, "height": 6,
              "properties": {
                "title": "404 and 403 \u2014 404 spikes mean segments asked for too early, or a missing init segment",
                "region": "us-east-1", "view": "timeSeries", "stat": "Average", "period": 300,
                "yAxis": { "left": { "min": 0, "label": "percent" } },
                "metrics": [
                  [ "AWS/CloudFront", "404ErrorRate", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "404" } ],
                  [ "AWS/CloudFront", "403ErrorRate", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "403" } ],
                  [ "AWS/CloudFront", "401ErrorRate", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "401" } ] ] } },

            { "type": "metric", "x": 0, "y": 30, "width": 24, "height": 6,
              "properties": {
                "title": "Origin-side failures \u2014 502 bad gateway, 503 unavailable, 504 timeout. Any of these means CloudFront could not get a usable response from the origin.",
                "region": "us-east-1", "view": "timeSeries", "stat": "Average", "period": 300,
                "yAxis": { "left": { "min": 0, "label": "percent" } },
                "metrics": [
                  [ "AWS/CloudFront", "502ErrorRate", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "502 bad gateway" } ],
                  [ "AWS/CloudFront", "503ErrorRate", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "503 unavailable" } ],
                  [ "AWS/CloudFront", "504ErrorRate", "DistributionId", "${PlaybackDistribution}", "Region", "Global", { "label": "504 timeout" } ] ] } }
          ]
        }

  # ---------------- Operator buttons ----------------
  # Two SSM documents so a non-technical operator never has to open a shell or
  # remember a command: Systems Manager > Run Command > pick one > Run.
  #
  # The CHECK document exists because the most common incident is not a broken
  # origin at all - it is the encoder having stopped, or initialisation segments
  # missing after a restart. Both look like "the stream is broken" and neither is
  # fixed by touching this server. Rebooting when init segments are missing makes
  # it WORSE: it clears RAM again and the encoder still has to be restarted.
  CheckDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub '${ChannelPrefix}-1-CHECK-stream-status'
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      Content:
        schemaVersion: '2.2'
        description: >-
          READ ONLY. Safe to run at any time, changes nothing. Reports in plain
          English whether the stream is healthy and, if not, what to do about it.
        mainSteps:
          - action: aws:runShellScript
            name: checkStream
            inputs:
              timeoutSeconds: '60'
              runCommand:
                - |
                  echo "==============================================="
                  H=$(curl -s --max-time 5 http://127.0.0.1:9095/-/healthz)
                  if [ -z "$H" ]; then
                    echo " PROBLEM: this server is not responding."
                    echo ""
                    echo " WHAT TO DO: run the document ending in 2-RESTART-origin-service."
                    echo " Do not reboot the server - a restart is faster and does the same thing."
                    echo "==============================================="
                    exit 0
                  fi
                  AGE=$(echo "$H" | grep -o '"last_ingest_age_s":[-0-9]*' | cut -d: -f2)
                  FILES=$(echo "$H" | grep -o '"files":[0-9]*' | cut -d: -f2)
                  MPD=$(ls /dev/null 2>/dev/null; curl -s --max-time 5 "http://127.0.0.1:9094/${StreamName}.mpd")
                  INIT=$(echo "$MPD" | grep -o 'initialization="[^"]*"' | head -1 | sed 's/.*="//;s/"//')
                  INITCODE=""
                  if [ -n "$INIT" ]; then
                    INITCODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:9094/$INIT")
                  fi

                  if [ "$AGE" = "-1" ] || [ "$AGE" -gt 60 ] 2>/dev/null; then
                    echo " PROBLEM: no video is arriving from the encoder."
                    echo ""
                    echo " Nothing is wrong with this server. It is waiting for video."
                    echo " WHAT TO DO: check Elemental Live is running and its output is started."
                    echo " Do NOT reboot or restart this server - it will not help."
                    echo "==============================================="
                    exit 0
                  fi

                  if [ -n "$INIT" ] && [ "$INITCODE" != "200" ]; then
                    echo " PROBLEM: people already watching are fine, but NEW viewers cannot start."
                    echo ""
                    echo " A start-up file the players need is missing. This happens after this"
                    echo " server restarts, because the encoder only sends that file when its"
                    echo " output starts."
                    echo ""
                    echo " WHAT TO DO: restart the OUTPUT GROUP in Elemental Live."
                    echo " Do NOT reboot or restart this server - that makes it worse."
                    echo "==============================================="
                    exit 0
                  fi

                  echo " OK - the stream is healthy."
                  echo ""
                  echo "   video arriving:      ${AGE}s ago  (0-2s is normal)"
                  echo "   segments in memory:  ${FILES}"
                  echo "   start-up file:       ${INITCODE:-n/a}  (200 = fine)"
                  echo ""
                  echo " If viewers still report problems, it is not this server."
                  echo " Check the player, or the CloudWatch dashboard for viewer errors."
                  echo "==============================================="

  # The emergency path. The NORMAL path is a stack update, which replaces the
  # instance and therefore rolls back automatically if the new build fails - see
  # docs/operations.md. This exists for when minutes matter, and it deliberately
  # prints the drift warning: it changes the running instance without changing the
  # stack, so the next instance replacement would revert unless ReleaseTag is
  # updated too.
  UpgradeDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub '${ChannelPrefix}-3-UPGRADE-to-a-new-version'
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      Content:
        schemaVersion: '2.2'
        description: >-
          Installs a specific version on the running server. Only use a version you
          have been told to use. Takes about a minute. AFTERWARDS YOU MUST RESTART
          THE ELEMENTAL LIVE OUTPUT GROUP.
        parameters:
          Version:
            type: String
            description: 'The version you were told to install, for example v0.5.1'
            allowedPattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
          RepoUrl:
            type: String
            default: !Ref RepoUrl
            description: 'Leave this alone.'
        mainSteps:
          - action: aws:runShellScript
            name: upgrade
            inputs:
              timeoutSeconds: '600'
              runCommand:
                - |
                  set -e
                  echo "Installing {{Version}}..."
                  dnf install -y -q golang git >/dev/null
                  rm -rf /opt/src
                  git clone --depth 1 --branch "{{Version}}" "{{RepoUrl}}" /opt/src
                  cd /opt/src
                  SHA=$(git rev-parse --short HEAD)
                  CGO_ENABLED=0 GOFLAGS=-mod=vendor GOPROXY=off GOCACHE=/tmp/gc HOME=/root \
                    go build -trimpath -ldflags "-s -w -X main.gitSHA=$SHA" \
                    -o /opt/src/go-chunked-streaming-server main.go
                  /opt/src/deploy/install.sh
                  sleep 4
                  H=$(curl -s --max-time 5 http://127.0.0.1:9095/-/healthz)
                  echo "==============================================="
                  if [ -z "$H" ]; then
                    echo " IT DID NOT COME BACK."
                    echo " The previous version is still on disk. Escalate now -"
                    echo " someone technical can put it back in one command."
                    echo "==============================================="
                    exit 1
                  fi
                  echo " {{Version}} is installed and running."
                  echo "   $H"
                  echo ""
                  echo " *** NOW RESTART THE OUTPUT GROUP IN ELEMENTAL LIVE. ***"
                  echo ""
                  echo " Then run the document ending 1-CHECK-stream-status to confirm."
                  echo ""
                  echo " NOTE FOR WHOEVER MAINTAINS THIS: the CloudFormation stack still"
                  echo " says its old version. Update the ReleaseTag parameter to"
                  echo " {{Version}}, or a future instance replacement will silently go"
                  echo " back to the old build."
                  echo "==============================================="

  RestartDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub '${ChannelPrefix}-2-RESTART-origin-service'
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      Content:
        schemaVersion: '2.2'
        description: >-
          Restarts the streaming software. Takes about 5 seconds. Use this instead
          of rebooting the server - it does the same thing far faster. AFTERWARDS
          YOU MUST RESTART THE ELEMENTAL LIVE OUTPUT GROUP.
        mainSteps:
          - action: aws:runShellScript
            name: restartOrigin
            inputs:
              timeoutSeconds: '120'
              runCommand:
                - |
                  echo "Restarting the streaming software..."
                  systemctl restart gochunked
                  sleep 5
                  H=$(curl -s --max-time 5 http://127.0.0.1:9095/-/healthz)
                  echo "==============================================="
                  if [ -z "$H" ]; then
                    echo " IT DID NOT COME BACK. Escalate - do not keep retrying."
                    echo "==============================================="
                    exit 1
                  fi
                  echo " The software restarted and is running."
                  echo ""
                  echo " *** NOW RESTART THE OUTPUT GROUP IN ELEMENTAL LIVE. ***"
                  echo ""
                  echo " The restart cleared this server's memory. Until the encoder"
                  echo " output is restarted, people already watching will be fine but"
                  echo " NEW viewers cannot start."
                  echo ""
                  echo " Then run the document ending in 1-CHECK-stream-status to confirm."
                  echo "==============================================="


Outputs:
  InstanceId:
    Value: !Ref OriginInstance

  SSMConnect:
    Value: !Sub 'aws ssm start-session --target ${OriginInstance} --region ${AWS::Region}'

  IngestDestination:
    Description: >-
      Elemental Live DASH output destination. Chunked transfer encoding MUST be
      on. Plaintext HTTP - reachable only from EncoderCidr.
    Value: !Sub 'http://${OriginEip}:${OriginPort}/${StreamName}'

  PlayerUrl:
    Value: !Sub 'https://${PlaybackDistribution.DomainName}/${StreamName}.mpd'

  OriginEipAddress:
    Description: Stable ingest address. Survives stop/start; re-pointing the encoder should never be on a recovery path.
    Value: !Ref OriginEip

  DashboardUrl:
    Description: One URL answering "is the stream up, is memory fine, is anything alarming"
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${ChannelPrefix}-origin'

  AlarmTopicArn:
    Description: >-
      SUBSCRIBE SOMETHING TO THIS. A topic with no subscription raises alarms
      nobody sees. aws sns subscribe --topic-arn <this> --protocol email --notification-endpoint you@example.com
    Value: !Ref AlarmTopic

  OperatorRunCommandConsole:
    Description: >-
      Give this to whoever operates the stream. Systems Manager > Run Command >
      choose the document starting 1-CHECK before doing anything else.
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/systems-manager/run-command/executing-commands?region=${AWS::Region}'

  AdminCheck:
    Description: Health and metrics, localhost only, over SSM
    Value: 'curl -s http://127.0.0.1:9095/-/healthz'
