AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ULL-DASH origin with CDN INGEST, for testing. Elemental Live -> CloudFront
  (+ Lambda@Edge manifest enrichment) -> EC2 origin -> CloudFront -> players.
  NOT the production path; use pipelines/direct-ingest for that.

# ---------------------------------------------------------------------------
# WHAT THIS IS FOR
#
#   Two things direct-ingest cannot test:
#
#   1. Whether the ingest CloudFront coalesces the encoder's chunked body. If it
#      batches 0.2s fragments into larger writes, it costs latency the origin
#      exists to recover. Deploy both, push one encoder at both, and compare how
#      a single segment grows at each origin. Unresolved as of v0.1.1.
#
#   2. The Lambda@Edge that injects ServiceDescription and UTCTiming into the
#      manifest as the encoder PUTs it. Elemental Live emits neither.
#
#   The origin here is built from the SAME repository and tag as direct-ingest,
#   so the ingest path is the only variable. It previously cloned upstream, which
#   made the origin a variable too - and an unpatched one, burning a CPU core per
#   live-edge viewer.
#
# WHY NOT USE THIS IN PRODUCTION
#
#   An ingest CDN forces the security group to accept write methods from
#   CloudFront's entire origin-facing prefix list, so ANY CloudFront distribution
#   can PUT or DELETE segments in the stream. direct-ingest restricts writes to
#   the encoder's address instead.
#
#   Playback here also uses CachingDisabled, so every viewer request reaches the
#   origin. That is deliberate for measurement and wrong for scale.
#
# DEPLOY ORDER
#
#   The Lambda@Edge stack (manifest-lambda-stack.yaml) must exist first, in
#   us-east-1, because Lambda@Edge only replicates from there. Pass its version
#   ARN as ManifestLambdaVersionArn. Leave that empty to skip enrichment.
# ---------------------------------------------------------------------------

Parameters:
  ChannelPrefix:
    Type: String
    Default: ch18a
    AllowedPattern: '[a-z0-9-]+'

  StreamName:
    Type: String
    Default: ch18live
    Description: Base name the encoder pushes under.

  ManifestLambdaVersionArn:
    Type: String
    Default: ''
    Description: >-
      Lambda@Edge version ARN from the ch18b-ingest-manifest-lambda stack in
      us-east-1. Reused rather than duplicated so both stacks run byte-identical
      manifest enrichment. Empty disables it.

  InstanceType:
    Type: String
    Default: m5.xlarge
    Description: 4 vCPU / 16 GB - comfortable headroom for RAM mode + many viewers.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI (resolved automatically).

  RepoUrl:
    Type: String
    Default: https://github.com/hcwongleo/ull-dash-origin.git
    Description: Source repository. Must match direct-ingest, or the origin
      becomes a variable in a test meant to isolate the ingest path.

  ReleaseTag:
    Type: String
    Default: v0.2.0
    Description: Git tag to build. Keep identical to direct-ingest.

  CloudFrontPrefixListId:
    Type: String
    Default: pl-14b2577d
    Description: >-
      CloudFront origin-facing managed prefix list (ap-east-1 = pl-14b2577d).
      Locks EC2:9094 inbound to CloudFront only. Look up per region with:
      aws ec2 describe-managed-prefix-lists --filters
      Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing

  OriginPort:
    Type: Number
    Default: 9094

Conditions:
  HasManifestLambda: !Not [!Equals [!Ref ManifestLambdaVersionArn, '']]

Mappings:
  ManagedPolicies:
    Cache:
      Disabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
      Optimized: 658327ea-f89d-4fab-a63d-7e88639e58f6         # Managed-CachingOptimized
    OriginRequest:
      AllViewerExceptHost: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
    ResponseHeaders:
      CorsPreflight: 5cc3b908-e619-4b99-88e5-2cf7f45965bd       # Managed-CORS-With-Preflight

Resources:

  # ---------------- Network (fresh VPC) ----------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-gochunked-vpc' }]

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-gochunked-igw' }]

  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-gochunked-public' }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  SubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # EC2:9094 inbound ONLY from CloudFront's origin-facing managed prefix list.
  # No 0.0.0.0. No inbound 22 (SSM is used for shell access).
  OriginSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: go-chunked origin - inbound 9094 only from CloudFront origin-facing prefix list
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref OriginPort
          ToPort: !Ref OriginPort
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing only
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-gochunked-sg' }]

  # ---------------- IAM (SSM access, no SSH) ----------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ---------------- EC2 running go-chunked ----------------
  OriginInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref OriginSecurityGroup]
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-gochunked-origin' }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -xe
          # Builds THIS repository at the pinned tag, identical to direct-ingest.
          # It previously cloned upstream and ran make, which meant this stack
          # deployed the unpatched server - one CPU core burned per live-edge
          # viewer, forever. Fine when the point was an A/B against upstream;
          # wrong now that the point is measuring the ingest CDN and the
          # Lambda@Edge, where the origin must not be the variable.
          dnf install -y golang git
          rm -rf /opt/src
          git clone --depth 1 --branch ${ReleaseTag} ${RepoUrl} /opt/src
          cd /opt/src
          CGO_ENABLED=0 GOFLAGS=-mod=vendor GOPROXY=off GOCACHE=/tmp/gc HOME=/root \
            go build -trimpath \
            -ldflags "-s -w -X main.gitSHA=$(git rev-parse --short HEAD)" \
            -o /opt/src/go-chunked-streaming-server main.go
          /opt/src/deploy/install.sh

  # ---------------- INGEST CloudFront (encoder chunked PUT) ----------------
  IngestDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ChannelPrefix} go-chunked - INGEST (encoder chunked PUT)'
        HttpVersion: http2
        Origins:
          - Id: ec2-origin
            DomainName: !GetAtt OriginInstance.PublicDnsName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: !Ref OriginPort
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        # Segments: no Lambda. IncludeBody would make CloudFront buffer the
        # chunked body, which would blunt read-while-write on both stacks and
        # invalidate the comparison.
        DefaultCacheBehavior:
          TargetOriginId: ec2-origin
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: !FindInMap [ManagedPolicies, Cache, Disabled]
          OriginRequestPolicyId: !FindInMap [ManagedPolicies, OriginRequest, AllViewerExceptHost]
        CacheBehaviors:
          - PathPattern: '*.mpd'
            TargetOriginId: ec2-origin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [ManagedPolicies, Cache, Disabled]
            OriginRequestPolicyId: !FindInMap [ManagedPolicies, OriginRequest, AllViewerExceptHost]
            LambdaFunctionAssociations: !If
              - HasManifestLambda
              - - EventType: origin-request
                  IncludeBody: true
                  LambdaFunctionARN: !Ref ManifestLambdaVersionArn
              - !Ref AWS::NoValue

  # ---------------- PLAYBACK CloudFront (viewer GET) ----------------
  PlaybackDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ChannelPrefix} go-chunked - PLAYBACK (viewer GET, CORS)'
        HttpVersion: http2and3
        Origins:
          - Id: ec2-origin
            DomainName: !GetAtt OriginInstance.PublicDnsName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: !Ref OriginPort
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: ec2-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !FindInMap [ManagedPolicies, Cache, Disabled]
          OriginRequestPolicyId: !FindInMap [ManagedPolicies, OriginRequest, AllViewerExceptHost]
          ResponseHeadersPolicyId: !FindInMap [ManagedPolicies, ResponseHeaders, CorsPreflight]
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0

Outputs:
  InstanceId:
    Description: EC2 instance id (connect via SSM Session Manager - no SSH)
    Value: !Ref OriginInstance

  SSMConnect:
    Description: Command to open a shell on the origin
    Value: !Sub 'aws ssm start-session --target ${OriginInstance} --region ${AWS::Region}'

  IngestDestination:
    Description: Elemental Live DASH output destination (chunked encoding + transfer ON)
    Value: !Sub 'https://${IngestDistribution.DomainName}/ch18_live/${StreamName}'

  PlayerUrl:
    Description: Player URL
    Value: !Sub 'https://${PlaybackDistribution.DomainName}/ch18_live/${StreamName}.mpd'

  OriginDirectCheck:
    Description: >-
      EC2 origin (reachable only from CloudFront prefix list; use SSM + curl
      localhost on the box to verify go-chunked is up).
    Value: !Sub 'http://${OriginInstance.PublicDnsName}:${OriginPort}/'
