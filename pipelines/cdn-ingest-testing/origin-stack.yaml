AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ch18 LINE B BASELINE + Lambda@Edge - the ORIGINAL POC origin, unmodified, with a
  manifest-enriching Lambda@Edge added to the ingest distribution so it can be
  compared against ch18b-gochunked-prod with the Lambda held constant.
  BASELINE - EXPECT IT TO FAIL UNDER LOAD. See the header block.
  ch18 LINE B - Open-source ULL-DASH origin POC. go-chunked-streaming-server on
  a single EC2 (read-while-write chunked origin), fronted by CloudFront for both
  ingest and playback. EC2 security group is locked to CloudFront's managed
  prefix list (NOT 0.0.0.0). SSM for access (no SSH/22). Single instance, no HA.

# ---------------------------------------------------------------------------
# WHAT THIS TESTS (Line B): can an open-source read-while-write origin recover
#   the ~4s ULL that S3 cannot? Elemental Live -> chunked PUT -> CloudFront ->
#   EC2(go-chunked) -> CloudFront -> player.  Stream name: servertest1
#
# OPEN UNKNOWNS (CFN builds the env; a live push is needed to confirm):
#   1. Does Elemental Live's chunked PUT interoperate with go-chunked?
#   2. Does the ingest CloudFront BUFFER the chunked body (which would blunt
#      read-while-write)? If so, fall back to direct-to-EC2 with SG locked to
#      the encoder IP.
#
# SECURITY: EC2:9094 inbound is restricted to the CloudFront origin-facing
#   managed prefix list (pl-14b2577d in ap-east-1), so the origin is NOT open
#   to 0.0.0.0. Access is via SSM Session Manager (no inbound 22).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# THIS IS THE BASELINE, DELIBERATELY UNPATCHED. It clones upstream at deploy time,
# so it carries the defects the production stack fixes. Expect, under real load:
#
#   - ~1 CPU core consumed per viewer reading the live edge, so the origin
#     saturates at roughly 16 concurrent reads on a 4 vCPU instance
#   - NO retention at all (-d is not passed), so memory grows at the ingest rate
#     and the process is killed in roughly 7 hours
#   - 404 storms at the live edge (-w is not passed)
#   - CachingDisabled on playback, so every viewer is a direct origin read
#   - a crash-loop stops permanently after 5 attempts in 10 seconds
#
# Run it alongside ch18b-gochunked-prod, push a second identical Elemental output
# group at it, and compare. Do not leave it running unattended.
#
# The ONLY addition over the original file is the *.mpd cache behaviour on the
# ingest distribution carrying the Lambda@Edge association, so the Lambda is held
# constant between the two stacks and the origin is the only variable.
# ---------------------------------------------------------------------------

Parameters:
  ChannelPrefix:
    Type: String
    Default: ch18a
    AllowedPattern: '[a-z0-9-]+'

  StreamName:
    Type: String
    Default: ch18live
    Description: Base name the encoder pushes under.

  ManifestLambdaVersionArn:
    Type: String
    Default: ''
    Description: >-
      Lambda@Edge version ARN from the ch18b-ingest-manifest-lambda stack in
      us-east-1. Reused rather than duplicated so both stacks run byte-identical
      manifest enrichment. Empty disables it.

  InstanceType:
    Type: String
    Default: m5.xlarge
    Description: 4 vCPU / 16 GB - comfortable headroom for RAM mode + many viewers.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI (resolved automatically).

  RepoUrl:
    Type: String
    Default: https://github.com/mjneil/go-chunked-streaming-server.git
    Description: go-chunked-streaming-server repo (MIT).

  CloudFrontPrefixListId:
    Type: String
    Default: pl-14b2577d
    Description: >-
      CloudFront origin-facing managed prefix list (ap-east-1 = pl-14b2577d).
      Locks EC2:9094 inbound to CloudFront only. Look up per region with:
      aws ec2 describe-managed-prefix-lists --filters
      Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing

  OriginPort:
    Type: Number
    Default: 9094

Conditions:
  HasManifestLambda: !Not [!Equals [!Ref ManifestLambdaVersionArn, '']]

Mappings:
  ManagedPolicies:
    Cache:
      Disabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
      Optimized: 658327ea-f89d-4fab-a63d-7e88639e58f6         # Managed-CachingOptimized
    OriginRequest:
      AllViewerExceptHost: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
    ResponseHeaders:
      CorsPreflight: 5cc3b908-e619-4b99-88e5-2cf7f45965bd       # Managed-CORS-With-Preflight

Resources:

  # ---------------- Network (fresh VPC) ----------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-gochunked-vpc' }]

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-gochunked-igw' }]

  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-gochunked-public' }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  SubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # EC2:9094 inbound ONLY from CloudFront's origin-facing managed prefix list.
  # No 0.0.0.0. No inbound 22 (SSM is used for shell access).
  OriginSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: go-chunked origin - inbound 9094 only from CloudFront origin-facing prefix list
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref OriginPort
          ToPort: !Ref OriginPort
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing only
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-gochunked-sg' }]

  # ---------------- IAM (SSM access, no SSH) ----------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ---------------- EC2 running go-chunked ----------------
  OriginInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref OriginSecurityGroup]
      Tags: [{ Key: Name, Value: !Sub '${ChannelPrefix}-gochunked-origin' }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -xe
          dnf install -y golang git make
          cd /opt
          git clone ${RepoUrl} gochunked
          cd gochunked
          export GO111MODULE=on
          export HOME=/root
          make
          cat > /opt/gochunked/cors.json <<'CORS'
          {
            "Access-Control-Allow-Origin": "*",
            "Access-Control-Allow-Methods": "GET,HEAD,OPTIONS",
            "Access-Control-Expose-Headers": "*"
          }
          CORS
          cat > /etc/systemd/system/gochunked.service <<UNIT
          [Unit]
          Description=go-chunked-streaming-server
          After=network.target
          [Service]
          ExecStart=/opt/gochunked/bin/go-chunked-streaming-server -r -i ${OriginPort} -o /opt/gochunked/cors.json -p /opt/gochunked/content
          WorkingDirectory=/opt/gochunked
          Restart=always
          User=root
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now gochunked

  # ---------------- INGEST CloudFront (encoder chunked PUT) ----------------
  IngestDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ChannelPrefix} go-chunked - INGEST (encoder chunked PUT)'
        HttpVersion: http2
        Origins:
          - Id: ec2-origin
            DomainName: !GetAtt OriginInstance.PublicDnsName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: !Ref OriginPort
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        # Segments: no Lambda. IncludeBody would make CloudFront buffer the
        # chunked body, which would blunt read-while-write on both stacks and
        # invalidate the comparison.
        DefaultCacheBehavior:
          TargetOriginId: ec2-origin
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: !FindInMap [ManagedPolicies, Cache, Disabled]
          OriginRequestPolicyId: !FindInMap [ManagedPolicies, OriginRequest, AllViewerExceptHost]
        CacheBehaviors:
          - PathPattern: '*.mpd'
            TargetOriginId: ec2-origin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [ManagedPolicies, Cache, Disabled]
            OriginRequestPolicyId: !FindInMap [ManagedPolicies, OriginRequest, AllViewerExceptHost]
            LambdaFunctionAssociations: !If
              - HasManifestLambda
              - - EventType: origin-request
                  IncludeBody: true
                  LambdaFunctionARN: !Ref ManifestLambdaVersionArn
              - !Ref AWS::NoValue

  # ---------------- PLAYBACK CloudFront (viewer GET) ----------------
  PlaybackDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ChannelPrefix} go-chunked - PLAYBACK (viewer GET, CORS)'
        HttpVersion: http2and3
        Origins:
          - Id: ec2-origin
            DomainName: !GetAtt OriginInstance.PublicDnsName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: !Ref OriginPort
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: ec2-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !FindInMap [ManagedPolicies, Cache, Disabled]
          OriginRequestPolicyId: !FindInMap [ManagedPolicies, OriginRequest, AllViewerExceptHost]
          ResponseHeadersPolicyId: !FindInMap [ManagedPolicies, ResponseHeaders, CorsPreflight]
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0

Outputs:
  InstanceId:
    Description: EC2 instance id (connect via SSM Session Manager - no SSH)
    Value: !Ref OriginInstance

  SSMConnect:
    Description: Command to open a shell on the origin
    Value: !Sub 'aws ssm start-session --target ${OriginInstance} --region ${AWS::Region}'

  IngestDestination:
    Description: Elemental Live DASH output destination (chunked encoding + transfer ON)
    Value: !Sub 'https://${IngestDistribution.DomainName}/ch18_live/${StreamName}'

  PlayerUrl:
    Description: Player URL
    Value: !Sub 'https://${PlaybackDistribution.DomainName}/ch18_live/${StreamName}.mpd'

  OriginDirectCheck:
    Description: >-
      EC2 origin (reachable only from CloudFront prefix list; use SSM + curl
      localhost on the box to verify go-chunked is up).
    Value: !Sub 'http://${OriginInstance.PublicDnsName}:${OriginPort}/'
